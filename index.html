<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyCoder TypeScript - AI Code Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>AnyCoder</h1>
                <p>AI Code Generator</p>
            </div>

            <div class="form-section">
                <div class="input-group">
                    <label for="prompt">What would you like to build?</label>
                    <textarea 
                        id="prompt" 
                        placeholder="Describe your application..."
                        rows="4"
                    ></textarea>
                </div>

                <div class="input-group">
                    <label for="language">Code Language</label>
                    <select id="language" aria-label="Select programming language">
                        <option value="html">HTML</option>
                        <option value="typescript">TypeScript</option>
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="css">CSS</option>
                        <option value="json">JSON</option>
                        <option value="markdown">Markdown</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="model">AI Model</label>
                    <input type="text" id="model-search" placeholder="Search models..." aria-label="Search AI models">
                    <select id="model" aria-label="Select AI model">
                        <option value="claude-sonnet-4">Loading models...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="file-upload">Reference File (Optional)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="file-upload" accept=".txt,.md,.json,.js,.ts,.html,.css,.py,.pdf,.docx,.jpg,.jpeg,.png">
                        <div class="file-upload-button" id="file-upload-button" role="button" tabindex="0" aria-label="Upload reference file">
                            <span class="file-upload-icon">📁</span>
                            <span class="file-upload-text">Choose file or drag & drop</span>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="website-url">Website URL for Redesign (Optional)</label>
                    <input type="url" id="website-url" placeholder="https://example.com">
                </div>

                <div class="button-group">
                    <button id="generate-btn" class="btn btn-primary" aria-label="Generate code">
                        <span class="btn-text">Generate</span>
                        <span class="btn-loader">⏳</span>
                    </button>
                    <button id="clear-btn" class="btn btn-secondary" aria-label="Clear all inputs">Clear</button>
                </div>

                <div class="settings-section">
                    <details>
                        <summary>API Settings</summary>
                        <div class="input-group">
                            <label for="api-key">Poe API Key</label>
                            <input type="password" id="api-key" placeholder="Enter your Poe API key">
                            <small class="muted-small">
                                Get your API key at <a href="https://poe.com/api_key" target="_blank" rel="noopener noreferrer" class="link-primary">poe.com/api_key</a>
                            </small>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="web-search">
                            <label for="web-search">Enable Web Search</label>
                        </div>
                    </details>
                </div>
            </div>

            <div class="demo-section">
                <h3>Quick Examples</h3>
                <div class="demo-buttons">
                    <button class="demo-btn" data-prompt="Create a todo app with add, delete, and mark complete functionality">Todo App</button>
                    <button class="demo-btn" data-prompt="Build a calculator with basic arithmetic operations">Calculator</button>
                    <button class="demo-btn" data-prompt="Create a responsive dashboard layout with sidebar navigation">Dashboard</button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content" role="main">
            <div class="tabs">
                <button class="tab-btn active" data-tab="code">Code</button>
                <button class="tab-btn" data-tab="preview">Preview</button>
                <button class="tab-btn" data-tab="output">Output</button>
                <button class="tab-btn" data-tab="history">History</button>
            </div>

            <div class="tab-content">
                <!-- Code Tab -->
                <div id="code-tab" class="tab-panel active">
                    <div class="code-header">
                        <div class="code-actions">
                            <button id="copy-btn" class="btn btn-small">Copy</button>
                            <button id="download-btn" class="btn btn-small">Download</button>
                            <button id="run-btn" class="btn btn-small">Run</button>
                            <select id="theme-select" title="Code theme selector">
                                <option value="github-dark">Dark Theme</option>
                                <option value="github">Light Theme</option>
                                <option value="monokai">Monokai</option>
                                <option value="vs2015">VS2015</option>
                            </select>
                        </div>
                    </div>
                    <div class="code-container">
                        <!-- File tabs for multi-file projects -->
                        <div id="file-tabs" class="file-tabs" aria-label="File tabs"></div>
                        <!-- File views -->
                        <div id="file-views" class="file-views">
                            <pre><code id="generated-code" class="hljs">// Your generated code will appear here...</code></pre>
                        </div>
                    </div>
                </div>

                <!-- Preview Tab -->
                <div id="preview-tab" class="tab-panel">
                    <div class="preview-container">
                        <iframe id="preview-frame" title="Live preview" sandbox="allow-scripts allow-same-origin"></iframe>
                        <div id="preview-placeholder" class="preview-placeholder">
                            <p>Preview will appear here for HTML content</p>
                        </div>
                    </div>
                </div>

                <!-- Output Tab -->
                <div id="output-tab" class="tab-panel">
                    <div class="output-container">
                        <div id="output-console" class="output-console"></div>
                    </div>
                </div>

                <!-- History Tab -->
                <div id="history-tab" class="tab-panel">
                    <div class="history-container">
                        <div id="history-list">
                            <p class="empty-state">No history yet. Generate some code to see it here!</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Status Toast -->
    <div id="status-toast" class="toast"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script type="module" src="/index.ts"></script>
    <div aria-live="polite" aria-atomic="true" class="sr-only" id="aria-announcements"></div>
</body>
</html>
